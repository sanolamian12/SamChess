<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬마 애니메이션 프롬프트</title>
<!-- tools/build_anim_prompts.py가 이 틀에 데이터를 넣어 assets/CharsAnim/index.html로 쓴다. 이 파일을 고친다. -->
<style>
:root {
  --bg: #15161a; --panel: #1e2026; --line: #30333b; --text: #e8e6e1; --dim: #9a9890;
  --accent: #d9a441; --ok: #5fb36b; --gen: #4d9be0; --chip: #2a2d35;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
button { font: inherit; color: inherit; background: var(--chip); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
input, select { font: inherit; color: inherit; background: var(--chip); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0 10px 0 0; }
.grow { flex: 1; }
#progress { color: var(--dim); }
main { display: grid; grid-template-columns: 230px 1fr; min-height: 0; }
#list { overflow: auto; border-right: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer;
  border-bottom: 1px solid #22242a; }
.row:hover { background: #23252c; }
.row.sel { background: #2b2a24; box-shadow: inset 3px 0 var(--accent); }
.row .g { width: 18px; text-align: center; font-weight: 700; color: var(--dim); }
.row .g.S { color: #c58bf0; } .row .g.A { color: #f0f0f0; } .row .g.E { color: var(--accent); }
.row .nm { flex: 1; }
.dots { display: flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3d45; font-size: 0; }
.dot.gen { background: var(--gen); } .dot.done { background: var(--ok); }
#view { overflow: auto; padding: 16px 20px 60px; }
.who { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.who h2 { margin: 0; font-size: 22px; }
.who .en { color: var(--dim); }
.who .scale { font-size: 12px; color: #1a1a1a; background: var(--gen); border-radius: 4px; padding: 1px 7px; }
.nav { margin-left: auto; display: flex; gap: 6px; }
.steps { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin-top: 10px; }
.steps ol { margin: 4px 0; padding-left: 20px; }
.look { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 2px 0 6px; font-size: 15px; }
.look dt { color: var(--dim); }
.look dd { margin: 0; color: var(--accent); font-weight: 600; }
.refbox { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.acts .mini { height: 44px; background: #000; border: 1px solid var(--line); border-radius: 4px; cursor: copy; }
.refbox img { height: 90px; max-width: 100%; background: #000; border: 1px solid var(--line); border-radius: 4px; cursor: copy; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.card.done { border-color: var(--ok); }
.card h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card h3 .k { background: var(--accent); color: #1a1a1a; border-radius: 4px; padding: 0 8px; }
.card h3 .note { font-weight: 400; color: var(--accent); font-size: 13px; }
.what { color: var(--dim); margin: 2px 0 10px; }
.what b { color: var(--text); font-weight: 600; }
.warn { background: #3a2a14; border: 1px solid var(--accent); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.acts .main { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 700; padding: 8px 18px; }
.save { color: var(--dim); }
.save code { color: var(--text); background: var(--chip); padding: 1px 6px; border-radius: 4px; }
.result { margin-top: 10px; }
.result img { max-width: 100%; max-height: 260px; background: #000; border: 1px solid var(--gen); border-radius: 4px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--dim); }
.single { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
pre { white-space: pre-wrap; word-break: break-word; background: #111216; border: 1px solid var(--line);
  border-radius: 6px; padding: 10px 12px; font: 12.5px/1.55 Consolas, "D2Coding", monospace; margin: 6px 0 0; }
.hint { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ok); color: #111;
  padding: 8px 16px; border-radius: 8px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 200px 1fr; }
  #list { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>꼬마 애니메이션 프롬프트 <small style="color:var(--dim);font-weight:400">2판</small></h1>
    <input id="q" placeholder="이름 검색 (한글 · 영문)" size="16">
    <select id="grade"><option value="">전 등급</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select>
    <label><input type="checkbox" id="todo"> 안 끝난 것만</label>
    <span class="grow"></span>
    <span id="progress"></span>
  </header>
  <main>
    <div id="list"></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>
<script>
const DATA = /*DATA*/null;
const KEYS = ["A", "B", "C", "D", "E"];
const WHAT = {
  A: "<b>평상 중간 3칸</b> — 평상 → 새 3칸 → 평상 (평상 자체는 안 그린다)",
  B: "<b>피격 다음 3칸</b> — 피격 → 새 3칸, 마지막이 쓰러짐 (피격 자체는 안 그린다)",
  C: "<b>이동 2칸</b> — 이동 → 새1 → 새2 → 새1 반복 (옆모습)",
  D: "<b>공격 2칸</b> — 평상 → 새 2칸 → 공격",
  E: "<b>마법 4칸</b>(2×2 격자, 반복) — 칸 사이를 넓게 띄워 효과가 안 붙게",
};
const EXT = ["png", "jpg", "jpeg", "webp"];

const store = {
  get(k, d) { try { const v = localStorage.getItem("anim2:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("anim2:" + k, JSON.stringify(v)); } catch {} },
};
let sel = store.get("sel", DATA[0].name);
const done = store.get("done", {});         // "A/이름": true
const found = {};                            // 저장 이름 → 찾은 파일 경로(없으면 null)

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const key = (k, name) => `${k}/${name}`;
const imgUrl = (name, k) => `ref/${encodeURIComponent(name)}${k === "sheet" ? "" : "_" + k}.png`;
const refUrl = (name) => imgUrl(name, "sheet");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1400);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(msg);
}
// 그림을 PNG로 클립보드에 — Gemini 입력창에서 Ctrl+V로 붙는다. http(localhost)에서만 된다(file://은 브라우저가 막는다)
async function copyImage(url, msg) {
  if (location.protocol === "file:") { toast("그림 복사는 열기.bat로 연 화면에서만 됩니다"); return; }
  try {
    const blob = fetch(url, { cache: "no-store" }).then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.blob();
    }).then((b) => (b.type === "image/png" ? b : new Blob([b], { type: "image/png" })));
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    toast(msg);
  } catch (e) {
    toast("그림 복사 실패 — " + (e.message || e));
  }
}

// raw/에 저장한 결과를 확장자를 바꿔 가며 찾는다
function probe(save) {
  if (save in found) return;
  found[save] = null;
  let i = 0;
  const next = () => {
    if (i >= EXT.length) return;
    const url = `raw/${encodeURIComponent(save)}.${EXT[i++]}`;
    const img = new Image();
    img.onload = () => { found[save] = url; clearTimeout(probe.h); probe.h = setTimeout(() => { renderList(); renderView(); }, 60); };
    img.onerror = next;
    img.src = url + "?t=" + Date.now();
  };
  next();
}
const state = (o, r) => (done[key(r.key, o.name)] ? "done" : found[r.save] ? "gen" : "");

function visible() {
  const q = $("#q").value.trim().toLowerCase(), g = $("#grade").value, only = $("#todo").checked;
  return DATA.filter((o) =>
    (!q || o.name.includes(q) || o.en.toLowerCase().includes(q)) &&
    (!g || o.grade === g) &&
    (!only || KEYS.some((k) => !done[key(k, o.name)])));
}

function renderList() {
  $("#list").innerHTML = visible().map((o) => `
    <div class="row ${o.name === sel ? "sel" : ""}" data-name="${esc(o.name)}">
      <span class="g ${o.grade}">${o.grade}</span><span class="nm">${esc(o.name)}</span>
      <span class="dots">${o.req.map((r) => `<span class="dot ${state(o, r)}" title="요청 ${r.key}">${r.key}</span>`).join("")}</span>
    </div>`).join("");
  const n = DATA.reduce((s, o) => s + KEYS.filter((k) => done[key(k, o.name)]).length, 0);
  $("#progress").textContent = `완료 ${n} / ${DATA.length * KEYS.length} 요청`;
}

function card(o, r, i) {
  const k = key(r.key, o.name), res = found[r.save];
  const note = r.key === "A" ? `평상: ${o.idle}` : r.key === "B" ? `쓰러짐: ${o.fall}` : "";
  return `
  <section class="card ${done[k] ? "done" : ""}">
    <h3><span class="k">요청 ${r.key}</span> ${r.img ? `그림(${r.imgLabel}) + 프롬프트` : "프롬프트만 (그림 안 붙임)"}
      ${note ? `<span class="note">${esc(note)}</span>` : ""}</h3>
    <div class="what">${r.what || WHAT[r.key]}</div>
    <div class="acts">
      ${r.img ? `<img class="mini" src="${imgUrl(o.name, r.img)}" data-img="${r.key}" alt="${r.imgLabel}" title="눌러도 복사됩니다">
        <button data-img="${r.key}">① ${r.imgLabel} 그림 복사</button>` : ""}
      <button class="main" data-copy="${r.key}">${r.img ? "② " : ""}프롬프트 복사</button>
      <button data-save="${r.key}">저장 이름 복사</button>
      <button data-done="${r.key}" class="${done[k] ? "on" : ""}">${done[k] ? "✓ 완료" : "완료 표시"}</button>
      <span class="save">저장: <code>raw/${esc(r.save)}.png</code> (jpg도 됨)</span>
    </div>
    ${res ? `<div class="result"><div class="hint">raw/에 있는 결과</div><img src="${res}?t=${Date.now()}" alt="결과"></div>` : ""}
    <details><summary>프롬프트 보기${r.single.length > 1 ? " · 한쪽만 망가졌을 때 따로 다시 뽑기" : ""}</summary>
      <pre>${esc(r.text)}</pre>
      ${r.single.length > 1 ? `<div class="single">${r.single.map((s, j) => `
        <button data-single="${r.key}|${j}">「${s.part}」만 프롬프트 복사</button>
        <span class="save">저장: <code>raw/${esc(s.save)}.png</code>${found[s.save] ? " ✓ 있음" : ""}</span>`).join("")}</div>
        <div class="hint">같은 대화에서 글만 보내면 됩니다. 새 대화라면 참고 그림을 먼저 붙이세요.</div>` : ""}
    </details>
  </section>`;
}

function renderView() {
  const o = DATA.find((x) => x.name === sel) || DATA[0];
  o.req.forEach((r) => { probe(r.save); r.single.forEach((s) => probe(s.save)); });
  $("#view").innerHTML = `
    <div class="who"><h2>${esc(o.name)}</h2><span class="en">${esc(o.en)} · ${o.grade}급</span>
      ${o.scale ? `<span class="scale" title="그림 면적이 커서 메뉴에서 줄여 세우는 장수 — 그림은 참고와 같은 크기로 받고, 굽기에서 맞춘다">크기 보정 ×${o.scale}</span>` : ""}
      <div class="nav"><button data-step="-1">← 이전</button><button data-step="1">다음 →</button></div></div>
    ${location.protocol === "file:" ? `<div class="warn">파일로 바로 열었습니다 — 그림 <b>복사</b>는 브라우저가 막습니다. <code>assets/CharsAnim/열기.bat</code>(또는 <code>npm run anim:page</code>)로 열어 주세요.</div>` : ""}
    <div class="steps">
      <dl class="look">
        <dt>든 것 · 외형</dt><dd>${esc(o.holdsKo)}</dd>
        <dt>평상 동작</dt><dd>${esc(o.idle)}</dd>
        <dt>쓰러짐</dt><dd>${esc(o.fall)}</dd>
      </dl>
      <div class="hint">프롬프트가 Gemini에 이렇게 적어 보냅니다(나머지 모자 · 옷은 그림을 따르라고 합니다). 아래 그림과 다르면 알려 주세요 — 표(<code>tools/anim_idle.tsv</code>)를 고칩니다.</div>
      <div class="refbox"><img src="${refUrl(o.name)}" data-ref="1" alt="참고 그림" title="눌러도 복사됩니다">
        <span class="hint">지금 다섯 자세(평상 · 이동 · 공격 · 마법 · 피격)</span></div>
      <div class="hint">단축키: <kbd>R</kbd> 참고 그림 복사 · <kbd>A</kbd>~<kbd>E</kbd> 그 요청의 프롬프트 복사 · <kbd>←</kbd><kbd>→</kbd> 장수 이동</div>
    </div>
    ${o.req.map((r, i) => card(o, r, i)).join("")}`;
}

function step(d) {
  const rows = visible(); if (!rows.length) return;
  const i = rows.findIndex((o) => o.name === sel);
  sel = rows[(i + d + rows.length) % rows.length].name; store.set("sel", sel);
  renderList(); renderView();
  document.querySelector(".row.sel")?.scrollIntoView({ block: "nearest" });
}
const cur = () => DATA.find((x) => x.name === sel);
const req = (k) => cur().req.find((r) => r.key === k);
function toggleDone(k) {
  const kk = key(k, sel); if (done[kk]) delete done[kk]; else done[kk] = true;
  store.set("done", done); renderList(); renderView();
}
const copyRef = () => copyImage(refUrl(sel), `${sel} 참고 그림 복사 — Gemini에서 Ctrl+V`);
const copyReq = (k) => copy(req(k).text, `${sel} · 요청 ${k} 프롬프트를 복사했습니다`);

document.addEventListener("click", (e) => {
  const b = e.target.closest("button, .row, img[data-ref], img[data-img]"); if (!b) return;
  if (b.dataset.ref) copyRef();
  else if (b.dataset.img) { const r = req(b.dataset.img); copyImage(imgUrl(sel, r.img), `${sel} ${r.imgLabel} 그림 복사 — Gemini에서 Ctrl+V`); }
  else if (b.dataset.name) { sel = b.dataset.name; store.set("sel", sel); renderList(); renderView(); }
  else if (b.dataset.step) step(+b.dataset.step);
  else if (b.dataset.copy) copyReq(b.dataset.copy);
  else if (b.dataset.save) copy(req(b.dataset.save).save, "저장 이름을 복사했습니다");
  else if (b.dataset.done) toggleDone(b.dataset.done);
  else if (b.dataset.single) {
    const [k, j] = b.dataset.single.split("|"), s = req(k).single[+j];
    copy(s.text, `${sel} · ${s.part}만 다시 뽑는 프롬프트를 복사했습니다`);
  }
});
["#q", "#grade", "#todo"].forEach((s) => $(s).addEventListener("input", renderList));
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (k === "R") copyRef();
  else if (KEYS.includes(k)) copyReq(k);
});

renderList(); renderView();
DATA.forEach((o) => o.req.forEach((r) => probe(r.save)));
document.querySelector(".row.sel")?.scrollIntoView({ block: "center" });
</script>
</body>
</html>
