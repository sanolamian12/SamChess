<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간단 플레이어</title>
<style>
  :root { --bg:#16181d; --panel:#22252c; --btn:#2f333c; --btnh:#3d424d; --fg:#e8e8ea; --dim:#9aa0aa; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Malgun Gothic",system-ui,sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; background:#000; min-height:0; position:relative; }
  video { max-width:100%; max-height:100%; }
  #hint { position:absolute; color:var(--dim); font-size:15px; pointer-events:none; text-align:center; }
  #stage.drag { outline:3px dashed var(--accent); outline-offset:-10px; }
  #bar { background:var(--panel); padding:10px 14px; display:flex; flex-direction:column; gap:8px; }
  #seek { width:100%; accent-color:var(--accent); }
  #row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  button { background:var(--btn); color:var(--fg); border:0; border-radius:6px; padding:8px 12px; font-size:14px; cursor:pointer; font-family:inherit; }
  button:hover { background:var(--btnh); }
  button:disabled { opacity:.4; cursor:default; }
  #open { background:var(--accent); }
  #time { color:var(--dim); font-variant-numeric:tabular-nums; margin-left:6px; font-size:13px; }
  #name { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  #vol { width:110px; accent-color:var(--accent); }
  #volv { width:36px; text-align:right; font-size:13px; color:var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <video id="v"></video>
  <div id="hint">[파일 열기]를 누르거나 MP4 / WAV 파일을 여기로 끌어다 놓으세요</div>
</div>
<div id="bar">
  <input id="seek" type="range" min="0" max="0" step="0.01" value="0" disabled>
  <div id="row">
    <button id="open">파일 열기</button>
    <button id="back"  disabled>⏪ 5초</button>
    <button id="play"  disabled>▶ 재생</button>
    <button id="pause" disabled>⏸ 일시정지</button>
    <button id="stop"  disabled>⏹ 정지</button>
    <button id="fwd"   disabled>5초 ⏩</button>
    <span id="time">0:00 / 0:00</span>
    <span class="spacer"></span>
    <span>🔊</span>
    <input id="vol" type="range" min="0" max="100" value="80">
    <span id="volv">80%</span>
  </div>
  <div id="name"></div>
</div>
<input id="file" type="file" accept=".mp4,.wav,video/mp4,audio/wav" hidden>

<script>
const $ = id => document.getElementById(id);
const v = $('v'), seek = $('seek');
let url = null;

function fmt(t) {
  if (!isFinite(t)) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function updateTime() {
  $('time').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
  if (!seek.matches(':active')) seek.value = v.currentTime;
}

function load(file) {
  if (!file) return;
  if (!/\.(mp4|wav)$/i.test(file.name)) { alert('MP4 또는 WAV 파일만 열 수 있습니다.'); return; }
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(file);
  v.src = url;
  $('name').textContent = file.name;
  $('hint').style.display = 'none';
  ['back','play','pause','stop','fwd'].forEach(id => $(id).disabled = false);
  seek.disabled = false;
  v.play().catch(() => {});
}

$('open').onclick = () => $('file').click();
$('file').onchange = e => { load(e.target.files[0]); e.target.value = ''; };

$('play').onclick  = () => v.play();
$('pause').onclick = () => v.pause();
$('stop').onclick  = () => { v.pause(); v.currentTime = 0; };
$('back').onclick  = () => { v.currentTime = Math.max(0, v.currentTime - 5); };
$('fwd').onclick   = () => { v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); };

$('vol').oninput = e => { v.volume = e.target.value / 100; $('volv').textContent = e.target.value + '%'; };
v.volume = 0.8;

seek.oninput = () => { v.currentTime = seek.value; };
v.addEventListener('loadedmetadata', () => { seek.max = v.duration; updateTime(); });
v.addEventListener('timeupdate', updateTime);
v.addEventListener('error', () => alert('이 파일을 재생할 수 없습니다. (지원하지 않는 코덱일 수 있습니다)'));
v.onclick = () => v.paused ? v.play() : v.pause();

// 드래그 앤 드롭
const stage = $('stage');
['dragenter','dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add('drag'); }));
['dragleave','drop'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.remove('drag'); }));
stage.addEventListener('drop', e => load(e.dataTransfer.files[0]));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

// 키보드: 스페이스 재생/일시정지, ←/→ 5초 이동
document.addEventListener('keydown', e => {
  if (!v.src) return;
  if (e.code === 'Space') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.code === 'ArrowLeft')  $('back').click();
  else if (e.code === 'ArrowRight') $('fwd').click();
});
</script>
</body>
</html>
